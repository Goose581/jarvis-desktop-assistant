name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build and runtime dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile all Python modules
        run: python -m compileall -q JARVIS.py JARVIS_GUI.py jarvis_workspace.py jarvis_model_manager.py launcher.py pyi_rth_stdio.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / Windows
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build and runtime dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile all Python modules
        run: python -m compileall -q JARVIS.py JARVIS_GUI.py jarvis_workspace.py jarvis_model_manager.py jarvis_spotify.py launcher.py pyi_rth_stdio.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup
        if: matrix.python-version == '3.13'
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build Windows app, update ZIP and installer
        if: matrix.python-version == '3.13'
        run: .\\build_release.bat
        shell: cmd

      - name: Upload v1.7.0 Windows packages
        if: matrix.python-version == '3.13' && success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.7.0-Windows
          path: |
            dist/JARVIS-Windows.zip
            dist/JARVIS-Windows.zip.sha256
            output/JARVIS-Setup.exe
          if-no-files-found: error
          retention-days: 30
